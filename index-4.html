<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enough in Christ</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--card:#f1f3f8;--ac:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#eef1f7;--card:#1d222d}}
body{font:16px system-ui;background:var(--bg);color:var(--fg);max-width:560px;margin:auto;padding:12px}
.c{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button,input,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #8884;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0}
nav{display:flex;gap:6px}nav button{flex:1;padding:8px 2px;font-size:14px;background:var(--card);color:var(--fg)}nav .on{background:var(--ac);color:#fff}
label{display:flex;gap:10px;align-items:center;padding:8px 0}input[type=checkbox]{width:24px;height:24px}
textarea{width:100%;box-sizing:border-box;min-height:90px}
.r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #8882}
sup{color:var(--ac);font-weight:bold;margin-right:2px}.sc{line-height:1.6;font-family:Georgia,serif;margin:8px 0}.h{background:#ffe27a;color:#1d2433;border-radius:3px}.b{padding:8px 0;border-bottom:1px solid #8882}ol{padding-left:20px;margin:4px 0}summary{cursor:pointer;padding:6px 0}
@media print{nav,button{display:none}}
</style></head><body><div id="app"></div><script>
const START='2026-11-22';
const P=`John 15:1-17|Ephesians 1:3-14|Without Me, Ye Can Do Nothing|Jesus didn't say we'd do a little less without Him. He said "without me ye can do nothing." That's not meant to discourage us. It's an invitation. A branch doesn't strain to produce fruit. It stays connected to the vine and the life flows through it. Most of us are tired because we've been trying to be the vine instead of the branch. Today, the goal isn't to try harder for God. It's to stay close to Him and let Him do the work in you.|Jesus is the vine and we are the branches, and apart from Him we can do nothing;The Father prunes us so that we bear more fruit;Abiding in His love leads to obedience, joy, and loving one another|What are you trying to do without God right now?;Are you loving the people around you the way Jesus loves you?;What is one thing that pulls you away from staying connected to Him?|Before you start your day, pause and pray, "Lord, I can't do this without You." Then pick one person and do one specific thing to show them love today, like a kind text, helping with something, or really listening.
1 Samuel 16:1-13|Jeremiah 1:4-8|The Lord Looketh on the Heart|Samuel almost picked the tallest brother. God chose the forgotten shepherd boy. Your value isn't set by looks, talent, or titles. It was settled when God chose you, and He sees your heart.|God does not judge by outward appearance;God chose David when no one else thought to include him;The Spirit of the Lord came upon David from that day on|Where do you measure yourself by outward things?;Do you believe God chose you on purpose?;Who around you gets overlooked the way David was?|Give someone a sincere compliment about their character today, not their looks.
1 Samuel 16:14-23|Psalm 78:70-72|Faithful in the Quiet Room|David's first assignment wasn't a battle. It was playing music for a troubled king. God often prepares us in hidden places before He uses us in public ones.|God's Spirit left Saul but rested on David;David served in a small, quiet role;His faithfulness brought him into the king's house|Where is God asking you to be faithful in a small way?;Do you only want to serve when people notice?;What are you learning in this quiet season?|Do one helpful thing today that no one will see or thank you for.
1 Samuel 17:1-24|1 Corinthians 1:26-31|Giants Look Smaller From God's Side|Israel's army saw a giant and froze. David saw someone defying the living God. Our giants feel huge until we stand them next to God.|The whole army was dismayed and greatly afraid of Goliath;Goliath taunted Israel morning and evening for forty days;David arrived on an errand and saw the problem differently|What giant feels biggest in your life right now?;Are you looking at the problem or at God?;Who can you ask to stand with you?|Write your giant on a piece of paper and pray over it by name.
1 Samuel 17:32-54|Psalm 144:1-2|Take Off Someone Else's Armor|Saul gave David his own armor, but it didn't fit. David used what God had already trained him with. You don't need to be someone else for God to use you.|David trusted God's faithfulness with the lion and the bear;He refused Saul's armor and used what he knew;He went out in the name of the LORD of hosts|What has God already been faithful in, in your life?;Whose armor are you trying to wear?;What do you have in your hand that God can use?|Use one thing you are good at to help someone today.
1 Samuel 18:1-16|Psalm 8|Wise When Everyone's Watching|David went from shepherd to celebrity overnight, and jealousy followed. He kept behaving wisely because the Lord was with him. Applause is loud, but God's presence is steadier.|Jonathan loved David and made a covenant with him;The crowd's praise stirred up Saul's jealousy;David behaved wisely because the Lord was with him|Who are you tempted to be jealous of?;How do you handle praise and being overlooked?;Where do you need God's presence more than people's approval?|Celebrate someone else's success out loud today.
Ephesians 2:1-10|Romans 8:28-30|By Grace, Not by Works|We didn't improve ourselves into God's family. We were dead, and He made us alive. Grace is a gift, so there is nothing to boast about and nothing to earn.|We were dead in sins but God made us alive with Christ;We are saved by grace through faith, not by works;We are His workmanship, created for good works|Do you try to earn God's approval?;What does it mean that you are His workmanship?;Which good work might God have prepared for you?|Do one good thing today purely as a thank-you for grace.
Colossians 1:15-23|John 1:1-14|Holding It All Together|Christ is before all things, and in Him all things hold together. If He holds the universe together, He can hold together whatever feels like it's falling apart in your life.|Christ is the image of the invisible God;All things were created through Him and for Him;He reconciled us to God through the blood of His cross|What feels like it is falling apart?;Where are you trying to hold things together yourself?;What would it look like to hand that to Christ?|Write down what is stressing you, pray over it, and then set it down.
1 Samuel 19:1-18|Psalm 59:16-17|Chosen Doesn't Mean Safe|David had done nothing wrong, yet Saul hunted him. Being chosen by God didn't protect him from hard things, but God kept him through them.|Jonathan spoke up for David and saved him for a time;Michal helped David escape through a window;God preserved David even while he was hunted|What hard season are you in right now?;Have you ever felt God was absent when He wasn't?;Who has helped you through hard times?|Thank someone who stood by you when things were hard.
1 Samuel 21:10-15|Psalm 34|Afraid and Still Praying|David was so afraid in Gath that he pretended to be insane. Not his proudest moment, yet Psalm 34 shows him praying right out of it. Even your worst moment can turn into prayer.|David fled to the enemy city of Gath out of fear;His fear drove him to act foolishly;God still protected him anyway|What are you afraid of right now?;When you are scared, what do you do first?;Will you pray about it before you try to fix it?|The next time you feel afraid today, pause and pray Psalm 34:4.
1 Samuel 23:14-29|Psalm 57|Just in Time|Saul closed in on David and then was suddenly called away. God's timing is rarely early, but it is never late.|David stayed in the wilderness while Saul searched for him;Jonathan strengthened David's hand in God;God rescued David right as Saul closed in|What are you waiting on God for?;Where have you seen God's timing show up?;What makes it hard to wait?|Write down what you are waiting on, and pray about it each time you check your phone.
1 Samuel 24:1-22|Psalm 142|The Choice Not to Strike Back|David had the chance to take revenge and chose not to. Trusting God with justice frees us from carrying it ourselves.|David spared Saul's life when he had the chance;He refused to lift his hand against the LORD's anointed;Saul admitted David was more righteous than he|Who is hardest for you to forgive?;What would it look like to leave justice to God?;Is there a grudge you are holding?|Pray for someone who hurt you, by name.
1 Samuel 30:1-8|Psalm 62|When Everything Is Gone|David lost his home, his family, and the trust of his men. In the lowest place, he encouraged himself in the LORD. When no one else can lift you, you can still run to God.|The Amalekites burned Ziklag and took their families;David's own men talked about stoning him;David encouraged himself in the LORD and asked God what to do|What do you do first when everything falls apart?;Who or what do you run to?;How can you strengthen yourself in God today?|Pick one verse to speak over yourself the next time things feel hard.
Philippians 3:7-14|Philippians 4:10-13|Better Than Anything I've Earned|Paul had a résumé most people would envy and called it loss compared to knowing Christ. Nothing you achieve adds to what He already finished.|Paul counted everything as loss for knowing Christ;Righteousness comes through faith in Christ, not the law;Paul pressed on toward the goal, forgetting what was behind|What do you count as your biggest achievement?;What are you tempted to value more than Christ?;What do you need to forget and press forward from?|Give up something status-driven today and serve someone instead.
Romans 3:21-26|Romans 5:6-11|The Ground Is Level|All have sinned and fall short, and all are made right through grace in Christ Jesus. No one is too far gone and no one is good enough alone.|All have sinned and fall short of God's glory;We are justified freely by His grace;Redemption is in Christ Jesus|Do you ever feel too far gone?;Do you ever feel better than someone else?;What would change if you lived like grace is free?|Tell a friend what grace means to you.
2 Samuel 7:1-17|Psalm 89:1-4|Who Builds the House?|David wanted to build God a house. God replied that He would build David a house. We often try to do God's job for Him, but He is the builder.|David wanted to build God a house;God reminded David He took him from the sheepcote;God promised to establish David's house and kingdom forever|Where are you trying to do God's job for Him?;What has God promised you in His Word?;Do you trust Him to build what He wants?|Serve someone quietly today without announcing it.
2 Samuel 11:1-13|James 1:13-15|One Look, One Sin|David stayed home when kings went to war, and one look led to one sin. Temptation often starts when we are somewhere we should not be.|David was home when he should have been at war;He saw, desired, and took;His cover-up began right away|What places or habits tempt you?;Who can ask you hard questions?;What do you need to stay away from this week?|Avoid one tempting place or habit today and tell a trusted person why.
2 Samuel 11:14-27|Proverbs 28:13|The Cover-Up|One sin led to a cover-up, and the cover-up led to something worse. Hidden things grow in the dark. God wants us to bring them into the light.|David's cover-up led to Uriah's death;David thought it was over after Bathsheba became his wife;But the thing David had done displeased the LORD|What are you hiding right now?;Who knows the real you?;What would it cost you to tell the truth?|Bring one hidden thing to God in prayer today, and consider telling a trusted person.
2 Samuel 12:1-15|Psalm 139:1-12|Thou Art the Man|Nathan told David a story, then pointed and said, "Thou art the man." It hurt, and it was mercy. God confronts us because He wants us restored, not ruined.|Nathan used a story to show David his sin;David confessed, "I have sinned against the LORD";God forgave David but the consequences remained|What is God asking you to stop and face?;Do you listen when someone tells you a hard truth?;What have you been excusing?|Ask God to show you one thing to confess, and write it down honestly.
Psalm 51|Psalm 32|A Clean Heart|David's prayer has no excuses, only mercy. We cannot wash ourselves clean. Only God can, and He gladly does.|David asked for mercy based on God's lovingkindness, not his own merit;He asked for a clean heart and a right spirit;God desires a broken and contrite heart|What do you need to confess?;What do you need God to clean in your heart?;Do you believe He wants to forgive you?|Pray Psalm 51:10 slowly three times, then receive His forgiveness.
1 John 1:5-10|Romans 8:1-4|Walking in the Light|If we confess our sins, He is faithful and just to forgive us. Confession is not groveling. It is stepping into the light with a God who already knows.|God is light and in Him is no darkness at all;If we walk in the light, we have fellowship and the blood of Jesus cleanses us;If we confess our sins, He is faithful and just to forgive|Is there anything you are keeping in the dark?;Do you believe He is faithful to forgive?;Who do you need to forgive?|Confess one thing to God today, then thank Him for forgiving it.
Romans 8:31-39|Romans 8:14-17|Nothing Can Separate|Nothing can separate you from the love of God in Christ Jesus. Not failure, not fear, not your worst day. That love isn't earned and can't be lost.|If God is for us, who can be against us;He gave His own Son for us;Nothing in all creation can separate us from His love|What makes you think God's love could run out?;What fear needs to hear this today?;How would you live if you were certain of this?|Read Romans 8:38-39 out loud, then tell a friend God loves them.
Psalm 23|John 10:1-18|Sheep Can't Lead Themselves|David had been a shepherd and knew how helpless sheep are. The Lord is my shepherd, so I shall not want. He leads, restores, protects, and stays.|The Lord provides everything we need;He leads, restores, and walks with us through the valley;His goodness and mercy follow us all our days|Where are you trying to lead yourself?;What does it mean to say, I shall not want?;Where do you need to be led through a valley?|Ask God to lead one decision today, and listen before you act.
Psalm 63|John 6:35-40|Thirsty|In a dry and thirsty land, David said God's lovingkindness is better than life. When everything else runs dry, Christ is still enough.|David longed for God like a thirsty land;God's lovingkindness is better than life;David's soul followed hard after God|What are you thirsty for right now?;What do you reach for when you feel empty?;Is God enough for you today?|Pray before you reach for your phone or a snack when you feel empty.
Psalm 139:13-24|Jeremiah 29:11-14|Made on Purpose|God formed you in your mother's womb and wrote your days before you lived one. You are not an accident, and He knows you completely.|God formed our inward parts and knit us together;We are fearfully and wonderfully made;God's thoughts toward us are precious and many|Do you believe you were made on purpose?;What do you dislike about yourself that God made?;What would change if you trusted His design?|Look in the mirror today and thank God for how He made you.
2 Samuel 22:1-20|Isaiah 41:8-10|My Rock and My Deliverer|At the end of his life, David looked back and called the Lord his rock, fortress, and deliverer. When you look back, you will see Him carrying you too.|David called the LORD his rock, fortress, and deliverer;God heard him when he cried out in distress;God delivered him because He delighted in him|Where has God rescued you?;What do you call God in hard times?;How can you tell that story to someone else?|Share one story of God's help with someone today.
Psalm 27|Matthew 11:28-30|One Thing|Whom shall I fear? The LORD is my light and salvation. David wanted one thing above all: to dwell with God. What is the one thing you want most?|The LORD is our light, salvation, and strength;David desired one thing: to dwell in God's house and see His beauty;We are told to wait on the LORD and be of good courage|What is the one thing you want most?;What are you afraid of that this psalm speaks to?;How can you wait on the LORD this week?|Write down the one thing you want most, and offer it to God.
2 Corinthians 12:7-10|Galatians 2:20|Strong in Weakness|Paul asked three times for relief, and God answered, "My grace is sufficient for thee." His power shows up best in our weakness.|Paul had a thorn in the flesh to keep him humble;God said His grace is sufficient;His strength is made perfect in weakness|What weakness do you wish God would remove?;Why is it hard to ask for help?;How might God show up in your weakness?|Tell a trusted friend about a weakness and ask them to pray.
John 15:1-11|Psalm 16|Stay Close|We started with the vine and we end with the vine. Abide in me. Without Him we can do nothing, but with Him we bear fruit that lasts.|Abiding in Christ is the source of fruit;His words abiding in us shape our prayers;He wants our joy to be full|What has changed in you over these four weeks?;What have you learned about God?;What habit do you want to keep?|Choose one habit from this month and commit to keep it going.`.split('\n').map(l=>l.split('|'));
const TH=['Week 1 · Chosen','Week 2 · Dependent','Week 3 · The Halt','Week 4 · Enough in Christ'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),iso=t=>new Date(t).toISOString().slice(0,10);
let me=localStorage.me||'',pin=localStorage.pin||'',code=localStorage.code||'',role=null,tab='Today',rows=[],pr=[],pend=[];
const today=new Date().toLocaleDateString('en-CA');
const I=Math.min(28,Math.max(0,Math.round((Date.parse(today)-Date.parse(START))/864e5))),DAY=iso(Date.parse(START)+I*864e5),live=today===DAY;
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const api=async(a,d={})=>{let r,j;try{r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,name:me,pin,code,...d})});j=await r.json()}catch(e){alert('Cannot reach the app server (error '+(r?r.status:'network')+'). Tell your leader.');throw e}if(j.error){alert(j.error);throw new Error(j.error)}return j};
const rd=(n,d)=>rows.some(r=>r.name==n&&r.day==d&&r.rd);
const streak=n=>{let d=Date.parse(today),k=0;if(!rd(n,iso(d)))d-=864e5;while(rd(n,iso(d))){k++;d-=864e5}return k};
let intro=true;
const L=k=>P[I][k].split(';').map(a=>`<li>${a}</li>`).join('');
async function load(){rows=(await api('board')).rows||[];pr=(await api('prayers')).rows||[];if(role=='admin')pend=(await api('admin')).rows||[];draw()}
function draw(){
 if(!me&&intro){$('#app').innerHTML=`<div style="text-align:center;padding:24px 8px"><h1 style="margin:0">ENOUGH</h1><p><small>A 4-week journey through scripture, together</small></p></div><div class=c><p>Life can be hard. Some days we feel tired, overwhelmed, behind, or just not good enough. Maybe you feel like you have to have it all together, or like you are carrying everything alone.</p><p>You are not alone. Over the next four weeks we will walk through the story of David: a shepherd boy who was chosen, who stumbled, and who learned that life cannot be done without God. And we will do it together.</p><p><b>With Christ, you are enough.</b> Not because of what you do, but because of who He is and whose you are.</p><p class=sc><i>"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness."</i><br><small>2 Corinthians 12:9, KJV</small></p><div style="text-align:center"><button style="font-size:1.1em;padding:12px 32px" onclick="intro=false;draw()">Begin</button></div></div><p style="text-align:center"><small>If things ever feel too heavy, talk to a leader or a trusted adult. If you are in crisis, call or text 988.</small></p>`;return}
 if(!me){$('#app').innerHTML=`<h2>Enough in Christ</h2><div class=c><p>First and last name, plus a 4-digit PIN.<br><small>New? Pick any PIN you will remember. Coming back? Use the same name and PIN.</small></p><input id=n placeholder="First Last"><br><br><input id=p type=password inputmode=numeric maxlength=4 placeholder="4-digit PIN"> <button onclick="join()">Start</button></div>`;return}
 const m=rows.find(r=>r.name==me&&r.day==DAY)||{},ns=[...new Set(rows.map(r=>r.name))].sort((a,b)=>streak(b)-streak(a));
 const nav=['Today','Group','Prayer','Mine','Plan'].map(x=>`<button class="${x==tab?'on':''}" onclick="tab='${x}';draw()">${x}</button>`).join('');
 let v='';
 if(tab=='Today')v=`<div class=c><small>${TH[Math.min(3,Math.floor(I/7))]} · Day ${I+1} of 29${live?'':today<START?' · starts Sunday, Nov 22':' · finished'}</small><h3>${P[I][2]}</h3><small>${P[I][0]} · King James Version · tap a verse to highlight it</small><div id=s1 class=sc>Loading scripture…</div><b>Three takeaways</b><ol>${L(4)}</ol><p><b>Devotion</b><br>${P[I][3]}</p><p><b>Today's challenge</b><br>${P[I][6]}</p><details ontoggle="if(this.open)fill('s2','${P[I][1]}')"><summary>Go deeper: ${P[I][1]}</summary><div id=s2 class=sc>Loading…</div></details>
 <label><input type=checkbox id=a ${m.rd?'checked':''} ${live?'':'disabled'} onchange=tick()> I read it</label>
 <label><input type=checkbox id=b ${m.pr?'checked':''} ${live?'':'disabled'} onchange=tick()> I prayed</label><b>🔥 ${streak(me)}-day streak</b></div>
 <div class=c><b>Reflect and journal</b><ol>${L(5)}</ol><small>Private. Saved on this phone only.</small><textarea oninput="localStorage['j'+DAY]=this.value" placeholder="What stood out? Questions?">${esc(localStorage['j'+DAY]||'')}</textarea></div>`;
 if(tab=='Group'){v=`<div class=c>${ns.map(n=>`<div class=r><span>${esc(n)}</span><span>🔥${streak(n)} ${rd(n,today)?'✅':'⬜'}</span></div>`).join('')||'No one yet'}</div>`;
  if(role){const late=ns.filter(n=>!rd(n,today)&&!rd(n,iso(Date.parse(today)-864e5)));v+=`<div class=c><b>Needs a nudge (no reading yesterday or today)</b>${late.map(n=>`<div class=r>${esc(n)}</div>`).join('')||'<p>Everyone is on track 🎉</p>'}</div>`}}
 if(tab=='Prayer'){v=`<div class=c><b>Share a request</b><textarea id=q></textarea><label><input type=checkbox id=an> Keep my name private</label><button onclick=pray()>Send</button><p><small>Your leader approves requests before they're shared.</small></p></div>`+pr.map(p=>`<div class=c><b>${esc(p.who)}</b><p>${esc(p.body)}</p></div>`).join('');
  if(role=='admin')v+=`<div class=c><b>Pending approval</b>${pend.map(p=>`<p>${esc(p.name)}${p.anon?' (anonymous)':''}: ${esc(p.body)}<br><button onclick="ad('approve',${p.id})">Approve</button> <button onclick="ad('delete',${p.id})">Delete</button></p>`).join('')||'<p>None</p>'}<button onclick=rs()>Reset someone's PIN</button></div>`;
  v+=role?`<p><small>Leader mode: ${role}</small></p>`:`<p><button onclick=lead()>Leader login</button></p>`}
 if(tab=='Mine'){const H=Object.entries(JSON.parse(localStorage.h||'{}')),J=P.map((p,k)=>[iso(Date.parse(START)+k*864e5),p[2]]).filter(d=>localStorage['j'+d[0]]);
  v=`<div class=c><b>My highlights</b>${H.map(([k,t])=>`<div class=b><small>${esc(k.replace(/ (\d+)$/,' · v$1'))}</small><br>${esc(t)}</div>`).join('')||'<p><small>Tap any verse in the reading to highlight it.</small></p>'}</div><div class=c><b>My reflections</b>${J.map(d=>`<div class=b><small>${d[0].slice(5)} · ${d[1]}</small><br>${esc(localStorage['j'+d[0]]).replace(/\n/g,'<br>')}</div>`).join('')||'<p><small>Your journal entries will show here.</small></p>'}</div>`}
 if(tab=='Plan')v=`<div class=c><button onclick=print()>Print plan</button> <button onclick=signout()>Sign out</button>${P.map((p,k)=>`<div class=r><span>${iso(Date.parse(START)+k*864e5).slice(5)} · <b>${p[2]}</b></span><span><small>${p[0]}</small></span></div>`).join('')}</div>`;
 $('#app').innerHTML=`<div style="text-align:right;margin-bottom:6px"><button onclick="fz(-2)">A−</button> <button onclick="fz(2)">A+</button></div><nav>${nav}</nav>${v}`;if(tab=='Today')fill('s1',P[I][0])}
async function join(){const n=norm($('#n').value),p=$('#p').value;if(!n.includes(' '))return alert('Please enter first AND last name');if(!/^\d{4}$/.test(p))return alert('PIN must be exactly 4 digits');me=n;pin=p;try{await api('login');await api('join',{day:DAY})}catch(e){me='';pin='';return}localStorage.me=me;localStorage.pin=pin;load()}
const S={};
async function fill(id,ref){const el=$('#'+id);if(!el)return;try{if(!S[ref]){const r=await(await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'verse',ref})})).json();if(!r.v)throw 0;S[ref]=r.v}const H=JSON.parse(localStorage.h||'{}');el.innerHTML=S[ref].map(x=>{const k=ref+' '+x[0];return `<span class="${H[k]?'h':''}" data-k="${esc(k)}" onclick="hl(this)"><sup>${x[0]}</sup>${esc(x[1])} </span>`}).join('')}catch(e){el.textContent='Could not load right now. Please read '+ref+' in your Bible.'}}
function hl(el){const k=el.dataset.k,H=JSON.parse(localStorage.h||'{}');if(H[k])delete H[k];else H[k]=el.lastChild.textContent.trim();localStorage.h=JSON.stringify(H);el.classList.toggle('h')}
function fz(d){const n=Math.min(26,Math.max(13,+(localStorage.fs||16)+d));localStorage.fs=n;document.body.style.fontSize=n+'px'}
async function tick(){await api('checkin',{day:DAY,rd:$('#a').checked,pr:$('#b').checked});load()}
async function pray(){const b=$('#q').value;if(!b.trim())return;await api('pray',{body:b,anon:$('#an').checked});alert('Sent! Your leader will review it.');load()}
function signout(){['me','pin','code'].forEach(k=>localStorage.removeItem(k));location.reload()}
async function rs(){const t=prompt('Full name to reset');if(t){await api('admin',{op:'reset',target:t});alert('Done. They can sign in again with a new PIN.')}}
async function ad(op,id){pend=(await api('admin',{op,id})).rows;load()}
async function lead(){const c=prompt('Leader code');if(!c)return;code=c;role=(await api('role')).role;if(role)localStorage.code=c;else{code='';alert('Wrong code')}load()}
document.body.style.fontSize=(localStorage.fs||16)+'px';
(async()=>{if(code)role=(await api('role')).role;me?load():draw()})();
</script></body></html>
