<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enough in Christ</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--card:#f1f3f8;--ac:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#eef1f7;--card:#1d222d}}
body{font:16px system-ui;background:var(--bg);color:var(--fg);max-width:560px;margin:auto;padding:12px}
.c{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button,input,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #8884;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0}
nav{display:flex;gap:6px}nav button{flex:1;padding:8px 2px;font-size:14px;background:var(--card);color:var(--fg)}nav .on{background:var(--ac);color:#fff}
label{display:flex;gap:10px;align-items:center;padding:8px 0}input[type=checkbox]{width:24px;height:24px}
textarea{width:100%;box-sizing:border-box;min-height:90px}
.r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #8882}
@media print{nav,button{display:none}}
</style></head><body><div id="app"></div><script>
const START='2026-11-22';
const P=`John 15:1-17|Ephesians 1:3-14
1 Samuel 16:1-13|Jeremiah 1:4-8
1 Samuel 16:14-23|Psalm 78:70-72
1 Samuel 17:1-24|1 Corinthians 1:26-31
1 Samuel 17:32-54|Psalm 144:1-2
1 Samuel 18:1-16|Psalm 8
Ephesians 2:1-10|Romans 8:28-30
Colossians 1:15-23|John 1:1-14
1 Samuel 19:1-18|Psalm 59:16-17
1 Samuel 21:10-22:2|Psalm 34
1 Samuel 23:14-29|Psalm 57
1 Samuel 24:1-22|Psalm 142
1 Samuel 30:1-8|Psalm 62
Philippians 3:7-14|Philippians 4:10-13
Romans 3:21-26|Romans 5:6-11
2 Samuel 7:1-17|Psalm 89:1-4
2 Samuel 11:1-13|James 1:13-15
2 Samuel 11:14-27|Proverbs 28:13
2 Samuel 12:1-15|Psalm 139:1-12
Psalm 51|Psalm 32
1 John 1:5-2:2|Romans 8:1-4
Romans 8:31-39|Romans 8:14-17
Psalm 23|John 10:1-18
Psalm 63|John 6:35-40
Psalm 139:13-24|Jeremiah 29:11-14
2 Samuel 22:1-20|Isaiah 41:8-10
Psalm 27|Matthew 11:28-30
2 Corinthians 12:7-10|Galatians 2:20
John 15:1-11|Psalm 16`.split('\n').map(l=>l.split('|'));
const TH=['Week 1 · Chosen','Week 2 · Dependent','Week 3 · The Halt','Week 4 · Enough in Christ'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),iso=t=>new Date(t).toISOString().slice(0,10);
let me=localStorage.me||'',pin=localStorage.pin||'',code=localStorage.code||'',role=null,tab='Today',rows=[],pr=[],pend=[];
const today=new Date().toLocaleDateString('en-CA');
const I=Math.min(28,Math.max(0,Math.round((Date.parse(today)-Date.parse(START))/864e5))),DAY=iso(Date.parse(START)+I*864e5),live=today===DAY;
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const api=async(a,d={})=>{let r,j;try{r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,name:me,pin,code,...d})});j=await r.json()}catch(e){alert('Cannot reach the app server (error '+(r?r.status:'network')+'). Tell your leader.');throw e}if(j.error){alert(j.error);throw new Error(j.error)}return j};
const rd=(n,d)=>rows.some(r=>r.name==n&&r.day==d&&r.rd);
const streak=n=>{let d=Date.parse(today),k=0;if(!rd(n,iso(d)))d-=864e5;while(rd(n,iso(d))){k++;d-=864e5}return k};
async function load(){rows=(await api('board')).rows||[];pr=(await api('prayers')).rows||[];if(role=='admin')pend=(await api('admin')).rows||[];draw()}
function draw(){
 if(!me){$('#app').innerHTML=`<h2>Enough in Christ</h2><div class=c><p>First and last name, plus a 4-digit PIN.<br><small>New? Pick any PIN you will remember. Coming back? Use the same name and PIN.</small></p><input id=n placeholder="First Last"><br><br><input id=p type=password inputmode=numeric maxlength=4 placeholder="4-digit PIN"> <button onclick="join()">Start</button></div>`;return}
 const m=rows.find(r=>r.name==me&&r.day==DAY)||{},ns=[...new Set(rows.map(r=>r.name))].sort((a,b)=>streak(b)-streak(a));
 const nav=['Today','Group','Prayer','Plan'].map(x=>`<button class="${x==tab?'on':''}" onclick="tab='${x}';draw()">${x}</button>`).join('');
 let v='';
 if(tab=='Today')v=`<div class=c><small>${TH[Math.min(3,Math.floor(I/7))]} · Day ${I+1} of 29${live?'':today<START?' · starts Sunday, Nov 22':' · finished'}</small><h3>${P[I][0]}</h3><p>Go deeper: ${P[I][1]}</p>
 <label><input type=checkbox id=a ${m.rd?'checked':''} ${live?'':'disabled'} onchange=tick()> I read it</label>
 <label><input type=checkbox id=b ${m.pr?'checked':''} ${live?'':'disabled'} onchange=tick()> I prayed</label><b>🔥 ${streak(me)}-day streak</b></div>
 <div class=c><b>Reflection</b><br><small>Private. Saved on this phone only.</small><textarea oninput="localStorage['j'+DAY]=this.value" placeholder="What stood out? Questions?">${esc(localStorage['j'+DAY]||'')}</textarea></div>`;
 if(tab=='Group'){v=`<div class=c>${ns.map(n=>`<div class=r><span>${esc(n)}</span><span>🔥${streak(n)} ${rd(n,today)?'✅':'⬜'}</span></div>`).join('')||'No one yet'}</div>`;
  if(role){const late=ns.filter(n=>!rd(n,today)&&!rd(n,iso(Date.parse(today)-864e5)));v+=`<div class=c><b>Needs a nudge (no reading yesterday or today)</b>${late.map(n=>`<div class=r>${esc(n)}</div>`).join('')||'<p>Everyone is on track 🎉</p>'}</div>`}}
 if(tab=='Prayer'){v=`<div class=c><b>Share a request</b><textarea id=q></textarea><label><input type=checkbox id=an> Keep my name private</label><button onclick=pray()>Send</button><p><small>Your leader approves requests before they're shared.</small></p></div>`+pr.map(p=>`<div class=c><b>${esc(p.who)}</b><p>${esc(p.body)}</p></div>`).join('');
  if(role=='admin')v+=`<div class=c><b>Pending approval</b>${pend.map(p=>`<p>${esc(p.name)}${p.anon?' (anonymous)':''}: ${esc(p.body)}<br><button onclick="ad('approve',${p.id})">Approve</button> <button onclick="ad('delete',${p.id})">Delete</button></p>`).join('')||'<p>None</p>'}<button onclick=rs()>Reset someone's PIN</button></div>`;
  v+=role?`<p><small>Leader mode: ${role}</small></p>`:`<p><button onclick=lead()>Leader login</button></p>`}
 if(tab=='Plan')v=`<div class=c><button onclick=print()>Print plan</button> <button onclick=signout()>Sign out</button>${P.map((p,k)=>`<div class=r><span>${iso(Date.parse(START)+k*864e5).slice(5)} · <b>${p[0]}</b></span><span><small>${p[1]}</small></span></div>`).join('')}</div>`;
 $('#app').innerHTML=`<nav>${nav}</nav>${v}`}
async function join(){const n=norm($('#n').value),p=$('#p').value;if(!n.includes(' '))return alert('Please enter first AND last name');if(!/^\d{4}$/.test(p))return alert('PIN must be exactly 4 digits');me=n;pin=p;try{await api('login');await api('join',{day:DAY})}catch(e){me='';pin='';return}localStorage.me=me;localStorage.pin=pin;load()}
async function tick(){await api('checkin',{day:DAY,rd:$('#a').checked,pr:$('#b').checked});load()}
async function pray(){const b=$('#q').value;if(!b.trim())return;await api('pray',{body:b,anon:$('#an').checked});alert('Sent! Your leader will review it.');load()}
function signout(){['me','pin','code'].forEach(k=>localStorage.removeItem(k));location.reload()}
async function rs(){const t=prompt('Full name to reset');if(t){await api('admin',{op:'reset',target:t});alert('Done. They can sign in again with a new PIN.')}}
async function ad(op,id){pend=(await api('admin',{op,id})).rows;load()}
async function lead(){const c=prompt('Leader code');if(!c)return;code=c;role=(await api('role')).role;if(role)localStorage.code=c;else{code='';alert('Wrong code')}load()}
(async()=>{if(code)role=(await api('role')).role;me?load():draw()})();
</script></body></html>
