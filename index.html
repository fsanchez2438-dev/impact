<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enough in Christ</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--card:#f1f3f8;--ac:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#eef1f7;--card:#1d222d}}
body{font:16px system-ui;background:var(--bg);color:var(--fg);max-width:560px;margin:auto;padding:12px}
.c{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button,input,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #8884;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0}
nav{display:flex;gap:6px}nav button{flex:1;padding:8px 2px;font-size:14px;background:var(--card);color:var(--fg)}nav .on{background:var(--ac);color:#fff}
label{display:flex;gap:10px;align-items:center;padding:8px 0}input[type=checkbox]{width:24px;height:24px}
textarea{width:100%;box-sizing:border-box;min-height:90px}
.r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #8882}
sup{color:var(--ac);font-weight:bold;margin-right:2px}.sc{line-height:1.6;font-family:Georgia,serif;margin:8px 0}.h{background:#ffe27a;color:#1d2433;border-radius:3px}.b{padding:8px 0;border-bottom:1px solid #8882}ol{padding-left:20px;margin:4px 0}summary{cursor:pointer;padding:6px 0}
@media print{nav,button{display:none}}
</style></head><body><div id="app"></div><script>
const START='2026-11-22';
const P=`John 15:1-17|Ephesians 1:3-14|Apart from Christ we can do nothing. Before we ever do anything for God, we are invited to abide in Him. What would change if you rested in being loved before you worked to be useful?|Sit with God for five quiet minutes with no requests;Write down one way you try to earn approval;Tell a friend what you will be reading this month
1 Samuel 16:1-13|Jeremiah 1:4-8|God looked past the impressive older brothers and chose the shepherd boy nobody invited. Your worth was settled by God's choice, not your résumé. Where do you measure yourself by outward things?|Thank God out loud that He chose you;Name one outward thing you measure yourself by and let it go;Encourage someone who usually gets overlooked
1 Samuel 16:14-23|Psalm 78:70-72|David's first calling was not a battlefield but a quiet room, playing music for a troubled king. Purpose often begins small and unseen. How can you be faithful in a quiet place today?|Do one small job today without being noticed;Put your phone away for ten minutes and pray;Ask God what faithful looks like in your small things
1 Samuel 17:1-24|1 Corinthians 1:26-31|Everyone else saw a giant; David saw an insult to the living God. Fear shrinks when our eyes move from the size of the problem to the size of God. What giant is loudest in your life?|Name your biggest giant in a prayer;Write down one time God has already come through for you;Tell someone you trust what you are facing
1 Samuel 17:32-54|Psalm 144:1-2|David refused Saul's armor and trusted the God who had been faithful in the field. He did not need to be someone else to be used. Where has God already proven faithful to you?|Stop comparing yourself to someone else today;List three ways God has been faithful to you;Use something you are good at to serve someone
1 Samuel 18:1-16|Psalm 8|Success came fast, and so did jealousy. David kept behaving wisely because the Lord was with him. His security came from God's presence, not applause. Where do you look for applause?|Celebrate someone else's win today;Notice where you want applause and pray about it;Do one good thing that nobody will see
Ephesians 2:1-10|Romans 8:28-30|We were dead and God made us alive, by grace and not by works, so no one can boast. You are His workmanship, made for good works He prepared ahead of time. Receive that before you try to earn anything.|Read Ephesians 2:8-9 out loud as a prayer;Write a one-sentence thank-you to God for grace;Do one good thing today as thanks and not to earn anything
Colossians 1:15-23|John 1:1-14|In Christ all things hold together. If He holds the universe together, He can hold your life together too. What feels like it is falling apart that you need to hand to Him?|Hand God the thing that feels like it is falling apart;Pray over one area where you want control;Write what it means that Christ holds all things together
1 Samuel 19:1-18|Psalm 59:16-17|David was innocent, yet hunted. Being chosen by God did not mean being protected from hard things; it meant God went with him through them. Where do you need His presence more than answers?|Tell God honestly how hard things feel;Text a friend who is going through something;Write down one way God has been with you in a hard time
1 Samuel 21:10-15|Psalm 34|In fear David acted foolishly, yet Psalm 34 shows him turning to the Lord from that very place. Even our worst moments can become places of prayer. Where are you hiding that you could pray instead?|Pray a short honest prayer when you feel afraid today;Memorize Psalm 34:4;Ask a friend how they are really doing
1 Samuel 23:14-29|Psalm 57|Saul was closing in on David, and then suddenly he was called away. God's timing is rarely early and never late. What are you waiting on Him for?|Write down what you are waiting on God for;Pray for patience each time you check your phone;Thank God for one time He came through just in time
1 Samuel 24:1-22|Psalm 142|David had the chance to take revenge and chose to trust God's justice instead. Strength is sometimes the choice not to strike back. Who is hard for you to forgive right now?|Pray for someone who hurt you;Choose one grudge to release;Do something kind for someone who is hard to love
1 Samuel 30:1-8|Psalm 62|With everything lost and his own men talking of stoning him, David strengthened himself in the Lord. When no one else can encourage you, you can still run to God. What do you do first when things fall apart?|Find a verse to speak over yourself when things are hard;Pray before you vent to anyone;Write down three things God has done for you this year
Philippians 3:7-14|Philippians 4:10-13|Paul counted everything he had achieved as loss compared to knowing Christ. Nothing you accomplish adds to what He already finished for you. What are you tempted to value more than Him?|List what you count as success and give it to God;Put Philippians 3:8 where you will see it today;Skip something that is about status and serve someone instead
Romans 3:21-26|Romans 5:6-11|All have sinned, and all are made right by grace through Christ. The ground is level at the cross: no one is too far gone and no one is good enough alone. Which of those do you need to hear today?|Thank God that grace is free;Pray for someone you think is too far gone;Tell a friend what grace means to you
2 Samuel 7:1-17|Psalm 89:1-4|David wanted to build God a house; God said He would build David a house. The Lord is the builder who keeps His promises. Where are you trying to do God's job for Him?|Pray about one thing you are trying to control;Write down one promise God has kept for you;Serve someone without telling anyone
2 Samuel 11:1-13|James 1:13-15|David stayed home when he should have been at war, and one look became one sin. Temptation often starts in places we should not be. Where do you need to put up a guard?|Name one place or habit that tempts you and avoid it today;Tell a trusted friend or leader you need accountability;Pray for a guard over your eyes and mind
2 Samuel 11:14-27|Proverbs 28:13|One sin led to a cover-up, and the cover-up led to worse. Hidden things grow in the dark. What have you been hiding that would be better brought into the light?|Bring one hidden thing to God in prayer;Ask yourself what you have been covering up;Tell a trusted person if you need help carrying it
2 Samuel 12:1-15|Psalm 139:1-12|Nathan said, "Thou art the man," and David finally stopped. The halt was painful, and it was also mercy. God confronts us because He wants us restored, not ruined. What is He asking you to stop and face?|Ask God to show you what to stop;Write down one thing you need to face honestly;Thank God for mercy that restores
Psalm 51|Psalm 32|David's prayer has no excuses, only mercy: "Create in me a clean heart, O God." We cannot clean ourselves; only He can. What do you need to confess honestly today?|Pray Psalm 51:10 slowly three times;Confess one specific thing without excuses;Receive forgiveness and write the word forgiven next to it
1 John 1:5-10|Romans 8:1-4|If we confess our sins, He is faithful and just to forgive us. Confession is not groveling; it is walking in the light with a God who already knows. What changes when you believe He is faithful?|Confess one thing to God today;Pray for someone you need to forgive;Write down one way you want to walk in the light this week
Romans 8:31-39|Romans 8:14-17|Nothing can separate us from the love of God in Christ Jesus. Not failure, not fear, not your worst day. How would you live if you were truly sure of that?|Read Romans 8:38-39 out loud;Write down your biggest fear and give it to God;Remind a friend that God loves them
Psalm 23|John 10:1-18|The Lord is my shepherd. David had been a shepherd, and he knew sheep cannot lead themselves. Where are you trying to lead yourself instead of following?|Ask God to lead one decision today;Say Psalm 23:1 to yourself when you feel anxious;List three ways God has taken care of you
Psalm 63|John 6:35-40|In a dry and thirsty land David said God's love is better than life. When everything else runs out, Christ is still enough. What are you thirsty for that only He can satisfy?|Notice what you reach for when you feel empty;Pray before you reach for it;Tell God what you are really thirsty for
Psalm 139:13-24|Jeremiah 29:11-14|Before you did anything, God knit you together and knew your days. You are not an accident or an afterthought. How does it change your day to know you were made on purpose?|Write down three things God made you good at;Remind yourself today that you were made on purpose;Tell a friend what you see God doing in them
2 Samuel 22:1-20|Isaiah 41:8-10|At the end of his life David called the Lord his rock, fortress, and deliverer. Looking back, he saw God had carried him every step. Where can you see God's hand in your own story?|Write the story of one time God rescued you;Share it with one person;Thank Him with a short prayer for how far He has brought you
Psalm 27|Matthew 11:28-30|Whom shall I fear? David asked, because the Lord was his light and salvation. The one thing he wanted most was to dwell with God. What is the one thing you want most?|Write down the one thing you want most;Ask God to make Him the thing you want most;Invite someone to pray with you this week
2 Corinthians 12:7-10|Galatians 2:20|God told Paul that His grace was enough and that His strength shows up best in weakness. You do not have to be strong to be used. Where do you feel weak, and can you bring it to Him?|Name one weakness and bring it to God;Ask for help instead of pretending you are fine;Thank God for strength that shows up in weakness
John 15:1-11|Psalm 16|We began with the vine and we end with the vine: abide in Me. Without Him we can do nothing; with Him we bear fruit that lasts. Whatever comes next, stay close.|Pick one habit from this month to keep;Write down what you learned about God;Encourage someone else to keep reading`.split('\n').map(l=>l.split('|'));
const TH=['Week 1 · Chosen','Week 2 · Dependent','Week 3 · The Halt','Week 4 · Enough in Christ'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),iso=t=>new Date(t).toISOString().slice(0,10);
let me=localStorage.me||'',pin=localStorage.pin||'',code=localStorage.code||'',role=null,tab='Today',rows=[],pr=[],pend=[];
const today=new Date().toLocaleDateString('en-CA');
const I=Math.min(28,Math.max(0,Math.round((Date.parse(today)-Date.parse(START))/864e5))),DAY=iso(Date.parse(START)+I*864e5),live=today===DAY;
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const api=async(a,d={})=>{let r,j;try{r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,name:me,pin,code,...d})});j=await r.json()}catch(e){alert('Cannot reach the app server (error '+(r?r.status:'network')+'). Tell your leader.');throw e}if(j.error){alert(j.error);throw new Error(j.error)}return j};
const rd=(n,d)=>rows.some(r=>r.name==n&&r.day==d&&r.rd);
const streak=n=>{let d=Date.parse(today),k=0;if(!rd(n,iso(d)))d-=864e5;while(rd(n,iso(d))){k++;d-=864e5}return k};
async function load(){rows=(await api('board')).rows||[];pr=(await api('prayers')).rows||[];if(role=='admin')pend=(await api('admin')).rows||[];draw()}
function draw(){
 if(!me){$('#app').innerHTML=`<h2>Enough in Christ</h2><div class=c><p>First and last name, plus a 4-digit PIN.<br><small>New? Pick any PIN you will remember. Coming back? Use the same name and PIN.</small></p><input id=n placeholder="First Last"><br><br><input id=p type=password inputmode=numeric maxlength=4 placeholder="4-digit PIN"> <button onclick="join()">Start</button></div>`;return}
 const m=rows.find(r=>r.name==me&&r.day==DAY)||{},ns=[...new Set(rows.map(r=>r.name))].sort((a,b)=>streak(b)-streak(a));
 const nav=['Today','Group','Prayer','Mine','Plan'].map(x=>`<button class="${x==tab?'on':''}" onclick="tab='${x}';draw()">${x}</button>`).join('');
 let v='';
 if(tab=='Today')v=`<div class=c><small>${TH[Math.min(3,Math.floor(I/7))]} · Day ${I+1} of 29${live?'':today<START?' · starts Sunday, Nov 22':' · finished'}</small><h3>${P[I][0]}</h3><div id=s1 class=sc>Loading scripture…</div><small>King James Version · tap a verse to highlight it</small><p><b>Today's thought:</b> ${P[I][2]}</p><b>Put it into practice</b><ol>${P[I][3].split(';').map(a=>`<li>${a}</li>`).join('')}</ol><details ontoggle="if(this.open)fill('s2','${P[I][1]}')"><summary>Go deeper: ${P[I][1]}</summary><div id=s2 class=sc>Loading…</div></details>
 <label><input type=checkbox id=a ${m.rd?'checked':''} ${live?'':'disabled'} onchange=tick()> I read it</label>
 <label><input type=checkbox id=b ${m.pr?'checked':''} ${live?'':'disabled'} onchange=tick()> I prayed</label><b>🔥 ${streak(me)}-day streak</b></div>
 <div class=c><b>Reflection</b><br><small>Private. Saved on this phone only.</small><textarea oninput="localStorage['j'+DAY]=this.value" placeholder="What stood out? Questions?">${esc(localStorage['j'+DAY]||'')}</textarea></div>`;
 if(tab=='Group'){v=`<div class=c>${ns.map(n=>`<div class=r><span>${esc(n)}</span><span>🔥${streak(n)} ${rd(n,today)?'✅':'⬜'}</span></div>`).join('')||'No one yet'}</div>`;
  if(role){const late=ns.filter(n=>!rd(n,today)&&!rd(n,iso(Date.parse(today)-864e5)));v+=`<div class=c><b>Needs a nudge (no reading yesterday or today)</b>${late.map(n=>`<div class=r>${esc(n)}</div>`).join('')||'<p>Everyone is on track 🎉</p>'}</div>`}}
 if(tab=='Prayer'){v=`<div class=c><b>Share a request</b><textarea id=q></textarea><label><input type=checkbox id=an> Keep my name private</label><button onclick=pray()>Send</button><p><small>Your leader approves requests before they're shared.</small></p></div>`+pr.map(p=>`<div class=c><b>${esc(p.who)}</b><p>${esc(p.body)}</p></div>`).join('');
  if(role=='admin')v+=`<div class=c><b>Pending approval</b>${pend.map(p=>`<p>${esc(p.name)}${p.anon?' (anonymous)':''}: ${esc(p.body)}<br><button onclick="ad('approve',${p.id})">Approve</button> <button onclick="ad('delete',${p.id})">Delete</button></p>`).join('')||'<p>None</p>'}<button onclick=rs()>Reset someone's PIN</button></div>`;
  v+=role?`<p><small>Leader mode: ${role}</small></p>`:`<p><button onclick=lead()>Leader login</button></p>`}
 if(tab=='Mine'){const H=Object.entries(JSON.parse(localStorage.h||'{}')),J=P.map((p,k)=>[iso(Date.parse(START)+k*864e5),p[0]]).filter(d=>localStorage['j'+d[0]]);
  v=`<div class=c><b>My highlights</b>${H.map(([k,t])=>`<div class=b><small>${esc(k.replace(/ (\d+)$/,' · v$1'))}</small><br>${esc(t)}</div>`).join('')||'<p><small>Tap any verse in the reading to highlight it.</small></p>'}</div><div class=c><b>My reflections</b>${J.map(d=>`<div class=b><small>${d[0].slice(5)} · ${d[1]}</small><br>${esc(localStorage['j'+d[0]]).replace(/\n/g,'<br>')}</div>`).join('')||'<p><small>Your journal entries will show here.</small></p>'}</div>`}
 if(tab=='Plan')v=`<div class=c><button onclick=print()>Print plan</button> <button onclick=signout()>Sign out</button>${P.map((p,k)=>`<div class=r><span>${iso(Date.parse(START)+k*864e5).slice(5)} · <b>${p[0]}</b></span><span><small>${p[1]}</small></span></div>`).join('')}</div>`;
 $('#app').innerHTML=`<div style="text-align:right;margin-bottom:6px"><button onclick="fz(-2)">A−</button> <button onclick="fz(2)">A+</button></div><nav>${nav}</nav>${v}`;if(tab=='Today')fill('s1',P[I][0])}
async function join(){const n=norm($('#n').value),p=$('#p').value;if(!n.includes(' '))return alert('Please enter first AND last name');if(!/^\d{4}$/.test(p))return alert('PIN must be exactly 4 digits');me=n;pin=p;try{await api('login');await api('join',{day:DAY})}catch(e){me='';pin='';return}localStorage.me=me;localStorage.pin=pin;load()}
const S={};
async function fill(id,ref){const el=$('#'+id);if(!el)return;try{if(!S[ref]){const r=await(await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'verse',ref})})).json();if(!r.v)throw 0;S[ref]=r.v}const H=JSON.parse(localStorage.h||'{}');el.innerHTML=S[ref].map(x=>{const k=ref+' '+x[0];return `<span class="${H[k]?'h':''}" data-k="${esc(k)}" onclick="hl(this)"><sup>${x[0]}</sup>${esc(x[1])} </span>`}).join('')}catch(e){el.textContent='Could not load right now. Please read '+ref+' in your Bible.'}}
function hl(el){const k=el.dataset.k,H=JSON.parse(localStorage.h||'{}');if(H[k])delete H[k];else H[k]=el.lastChild.textContent.trim();localStorage.h=JSON.stringify(H);el.classList.toggle('h')}
function fz(d){const n=Math.min(26,Math.max(13,+(localStorage.fs||16)+d));localStorage.fs=n;document.body.style.fontSize=n+'px'}
async function tick(){await api('checkin',{day:DAY,rd:$('#a').checked,pr:$('#b').checked});load()}
async function pray(){const b=$('#q').value;if(!b.trim())return;await api('pray',{body:b,anon:$('#an').checked});alert('Sent! Your leader will review it.');load()}
function signout(){['me','pin','code'].forEach(k=>localStorage.removeItem(k));location.reload()}
async function rs(){const t=prompt('Full name to reset');if(t){await api('admin',{op:'reset',target:t});alert('Done. They can sign in again with a new PIN.')}}
async function ad(op,id){pend=(await api('admin',{op,id})).rows;load()}
async function lead(){const c=prompt('Leader code');if(!c)return;code=c;role=(await api('role')).role;if(role)localStorage.code=c;else{code='';alert('Wrong code')}load()}
document.body.style.fontSize=(localStorage.fs||16)+'px';
(async()=>{if(code)role=(await api('role')).role;me?load():draw()})();
</script></body></html>
